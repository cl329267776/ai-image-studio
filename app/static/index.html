<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 商品图生成工具</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>AI 商品图生成工具</h1>
    <p class="subtitle">上传商品实拍原图,自动生成 5 张 800×800 主图 + 2 张九宫格详情图</p>

    <div class="upload-box">
      <input type="file" id="file" accept="image/*">
      <input type="text" id="prompt" placeholder="自定义提示词(可选):如「浅灰台面,自然光,高端质感」">
      <button id="upload-btn">开始生成</button>
    </div>

    <div id="progress" class="progress"></div>

    <h2>主图(800×800)</h2>
    <div id="main-images" class="grid-5"></div>

    <h2>详情图(九宫格,宽 800)</h2>
    <div id="detail-images" class="grid-2"></div>

    <h2>历史任务</h2>
    <div id="history" class="history"></div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
